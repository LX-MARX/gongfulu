<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>23 张工作表 · 在线填写引擎 —— 屋顶上的共富路</title>
<link rel="stylesheet" href="assets/css/main.css?v=20260912">
<link rel="stylesheet" href="assets/css/gov-print.css?v=20260912">
<style>
#formSearch{max-width:460px; font-size:15.5px}
#stageTags{margin-top:14px}
.fm-actions{display:flex; gap:14px; flex-wrap:wrap; margin-top:22px}
.arch-row{display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-top:8px}
.arch-row select{flex:1; min-width:260px}
/* 必填未填齐的拦截提示：普通 toast 一瞥就过，这里加粗红框＋脉冲光圈，让人没法忽略 */
#fillMsg.warn-box{border-width:2px; font-size:16.5px; padding:18px 22px}
@keyframes missPulse{0%{box-shadow:0 0 0 0 rgba(200,75,63,.55)}70%{box-shadow:0 0 0 16px rgba(200,75,63,0)}100%{box-shadow:0 0 0 0 rgba(200,75,63,0)}}
.miss-pulse{animation:missPulse 1.2s ease-out 3}
</style>
</head>
<body>

<section class="section grain" style="padding-top:56px">
  <div class="wrap">
    <div class="kicker rv">手册第八篇 · 工作表格</div>
    <h1 class="rv">23 张工作表 · 在线填写引擎</h1>
    <p class="lead rv" style="margin-top:14px">覆盖《整村光伏建设手册》第八篇 M-1 至 M-23 全部工作表格：在线填写、自动判定必填栏目（★）、一键生成公文格式打印版（A4 · 三线表），登录后可将填写内容暂存到个人账号、随时回填续填。</p>
  </div>
</section>

<!-- 列表视图 -->
<section class="section light" id="viewList">
  <div class="wrap">
    <div class="kicker rv">表格目录</div>
    <h2 class="rv">按使用阶段选表</h2>
    <p class="lead rv">一事一表，不得合并填制；关键栏目（★）不得空置，确无内容填「无」。（手册第 140 条）</p>
    <div style="margin-top:22px">
      <input type="search" id="formSearch" placeholder="搜索表格名称或编号，如：入户摸底 / M-14">
      <div id="stageTags"></div>
    </div>
    <div id="formGroups" style="margin-top:8px"></div>
  </div>
</section>

<!-- 填写视图 -->
<section class="section light" id="viewFill" style="display:none">
  <div class="wrap">
    <div id="fillHead"></div>
    <div id="fillNote" class="note-box" style="margin-top:18px"></div>
    <div class="card" style="margin-top:20px; border-color:var(--gold)">
      <h3 style="margin-bottom:12px">表头信息（写入公文打印版）</h3>
      <div id="fillMeta"></div>
    </div>
    <div id="fillBody"></div>
    <div id="fillMsg" style="display:none"></div>
    <div class="card" style="margin-top:20px">
      <h3 style="margin-bottom:6px">我的存档</h3>
      <p class="caption" style="margin:0 0 6px">登录后可将当前填写内容暂存到个人账号；选择历史存档可一键回填，重复暂存覆盖同一条。</p>
      <div class="arch-row">
        <select id="archSel"><option value="">（读取中……）</option></select>
      </div>
    </div>
    <div class="fm-actions">
      <button class="btn btn-gold" id="btnPrint">生成公文打印版</button>
      <button class="btn btn-line" id="btnSave">暂存到我的账号</button>
      <button class="btn btn-line" id="btnClear" style="border-color:#c8cdd4; color:#5a6b7c">清空重填</button>
      <button class="btn btn-line" id="btnBack" style="border-color:#c8cdd4; color:#5a6b7c">返回列表</button>
    </div>
    <p style="margin-top:22px"><a href="javascript:void(0)" id="btnBack2" style="font-size:14px">← 返回 23 张工作表列表</a></p>
  </div>
</section>

<!-- 打印隔离区（仅打印时输出，屏幕隐藏）；外层再包一层，让 PV.printZone 的祖先链标记有处可挂 -->
<div id="pzWrap"><div id="printZone" style="display:none"></div></div>

<script src="assets/js/data.js?v=20260912"></script>
<script src="assets/js/effects.js?v=20260912"></script>
<script src="assets/js/config.js?v=20260912"></script>
<script src="assets/js/api.js?v=20260912"></script>
<script src="assets/js/auth.js?v=20260912"></script>
<script src="assets/js/main.js?v=20260912"></script>
<script src="assets/js/forms.js?v=20260912"></script>
</body>
</html>
